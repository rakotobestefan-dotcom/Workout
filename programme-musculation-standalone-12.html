<title>Gain'sBar</title>
<style>
  :root{
    --bg:#12141a;
    --surface:#1b1e27;
    --surface2:#242836;
    --line:#30354512;
    --line2:#3a3f50;
    --accent:#ff5c39;
    --accent-dim:#ff5c3922;
    --accent2:#2fd9c4;
    --accent2-dim:#2fd9c422;
    --text:#f4f2ec;
    --muted:#8d92a3;
    --ring-bg:#2a2e3a;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%;}
  #app{min-height:100vh; display:flex; flex-direction:column; max-width:560px; margin:0 auto; position:relative;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 18px 10px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#1a1a1a;flex-shrink:0;}
  .brand-logo{width:34px;height:34px;border-radius:9px;flex-shrink:0;box-shadow:0 0 0 1.5px var(--line2);}
  .brand-name{font-weight:600; font-size:17px; letter-spacing:-0.02em;}
  .brand-name b{font-weight:800; color:var(--accent);}
  .brand-name i{font-style:normal; font-weight:800; color:var(--accent2);}
  .brand-title{font-weight:800; letter-spacing:-0.02em; font-size:15px; text-transform:uppercase;}
  .icon-btn{background:var(--surface); border:1px solid var(--line2); color:var(--text); width:38px;height:38px;
    border-radius:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .icon-btn svg{width:18px;height:18px;stroke:var(--text); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
  main{flex:1; padding:6px 18px 110px; overflow-y:auto;}
  h1.page-title{font-size:22px; font-weight:800; letter-spacing:-0.02em; margin:14px 0 4px;}
  p.page-sub{color:var(--muted); font-size:13.5px; margin:0 0 18px; line-height:1.4;}
  .section-label{font-size:11.5px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin:22px 0 10px;}
  .cat-header{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--surface); border:1.5px solid var(--line2); border-radius:14px; margin-bottom:6px; cursor:pointer;}
  .cat-header-left{display:flex; align-items:center; gap:10px;}
  .cat-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cat-label-text{font-size:13.5px; font-weight:800;}
  .cat-badge{font-size:11px; font-weight:800; color:#1a1a1a; border-radius:20px; padding:2px 8px;}
  .cat-chevron{font-size:11px;}
  .cat-body{margin-bottom:8px;}
  .diag-box{background:var(--surface2); border:1.5px dashed var(--line2); border-radius:12px; padding:10px 12px; font-size:12px; color:var(--muted); margin-bottom:14px; line-height:1.6;}
  .diag-btn{display:block; margin-top:8px; background:var(--accent2); color:#0d2421; border:none; border-radius:9px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .block-card{background:var(--surface); border:1.5px solid var(--line2); border-radius:var(--radius);
    padding:14px 14px; display:flex; align-items:center; gap:13px; margin-bottom:10px; cursor:pointer; transition:border-color .15s, background .15s;}
  .block-card.selected{border-color:var(--accent); background:linear-gradient(135deg, var(--accent-dim), var(--surface));}
  .block-card .order-badge{width:26px;height:26px;border-radius:50%;background:var(--accent); color:#1a1a1a; font-weight:800; font-size:13px;
    display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .block-card .check{width:22px;height:22px;border-radius:50%; border:2px solid var(--line2); flex-shrink:0;}
  .block-card.selected .check{display:none;}
  .block-icon{width:42px;height:42px;border-radius:12px; background:var(--surface2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .block-icon svg{width:26px;height:26px; stroke:var(--accent2); fill:none; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round;}
  .block-info{flex:1; min-width:0;}
  .block-info .name{font-weight:700; font-size:15.5px;}
  .block-info .meta{color:var(--muted); font-size:12.5px; margin-top:1px;}
  .bracket-select{margin-top:8px; background:var(--surface2); color:var(--accent2); border:1.5px solid var(--line2);
    border-radius:9px; font-size:12.5px; font-weight:700; padding:6px 8px; width:100%; max-width:230px;}
  .lsit-row{margin-top:8px; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);}
  .lsit-row input{width:54px; background:var(--surface2); border:1.5px solid var(--line2); border-radius:9px;
    color:var(--accent2); font-weight:700; padding:6px 8px; text-align:center; font-variant-numeric:tabular-nums;}
  .cta-bar{position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto; padding:14px 18px 22px;
    background:linear-gradient(to top, var(--bg) 70%, transparent); display:flex; gap:10px;}
  .btn{border:none; border-radius:14px; font-weight:800; font-size:14.5px; padding:15px 18px; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.02em; flex:1; text-align:center;}
  .btn-primary{background:var(--accent); color:#19130f;}
  .btn-primary:disabled{background:var(--surface2); color:var(--muted); cursor:not-allowed;}
  .btn-ghost{background:var(--surface); color:var(--text); border:1.5px solid var(--line2);}
  .btn-secondary{background:var(--accent2); color:#0d2421;}
  /* Player */
  .player-wrap{display:flex; flex-direction:column; align-items:center; padding-top:8px;}
  .player-tag{font-size:11px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent2); margin-bottom:6px;}
  .player-sub{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .player-name{font-size:24px; font-weight:800; text-align:center; letter-spacing:-0.01em; margin-bottom:4px; max-width:380px;}
  .player-target{color:var(--muted); font-size:14px; margin-bottom:22px; text-align:center;}
  .ring-wrap{position:relative; width:230px; height:230px; margin-bottom:22px;}
  .ring-wrap svg{width:230px;height:230px; transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:var(--ring-bg); stroke-width:10;}
  .ring-fg{fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 0.25s linear;}
  .ring-fg.rest{stroke:var(--accent2);}
  .ring-center{position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-icon svg{width:56px;height:56px; stroke:var(--text); fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; margin-bottom:6px;}
  .ring-time{font-size:42px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.02em;}
  .ring-time.rest{color:var(--accent2);}
  .player-controls{display:flex; gap:10px; width:100%; max-width:340px; margin-top:6px;}
  .manual-card{background:var(--surface); border:1.5px solid var(--line2); border-radius:20px; padding:24px 20px; width:100%; max-width:380px; text-align:center;}
  .manual-icon svg{width:70px;height:70px; stroke:var(--accent); fill:none; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; margin-bottom:10px;}
  .input-row{display:flex; align-items:center; justify-content:center; gap:10px; margin:18px 0 6px;}
  .input-row input{width:90px; text-align:center; font-size:24px; font-weight:800; background:var(--surface2); border:1.5px solid var(--line2);
    border-radius:12px; color:var(--text); padding:10px; font-variant-numeric:tabular-nums;}
  .input-row .unit{color:var(--muted); font-size:13px;}
  .last-time{color:var(--accent2); font-size:13px; margin-top:6px; background:var(--surface2); border-radius:9px; padding:6px 10px; display:inline-block;}
  .record-time{color:#f5c842; font-size:13px; margin-top:4px; background:var(--surface2); border-radius:9px; padding:6px 10px; display:inline-block;}
  .stats-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:6px;}
  .next-up{display:flex; flex-direction:column; align-items:center; margin-top:6px; margin-bottom:8px;}
  .next-up-label{font-size:10.5px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}

  .progress-dots span.current{background:var(--accent2);}

  .summary-val{color:var(--accent2); font-weight:700;}

async function loadState(){

    if(r){ const d = JSON.parse(r.value); S.tractionsBracket = d.bracket || '6-8'; S.tractionsDays = d.days || {}; }
    else {
      // migration depuis l'ancienne version (un seul palier 6-8)
      try{ const old = await window.storage.get('tractions-day', false); if(old){ S.tractionsDays['6-8'] = JSON.parse(old.value).day || 1; await saveTractionsProgress(); } }catch(e2){}
    }
  }catch(e){}
  try{ const r = await window.storage.get('history', false); if(r) S.history = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('lsit-duration', false); if(r) S.lsitDuration = parseInt(r.value,10) || LSIT_DEFAULT_DURATION; }catch(e){}

function step(o){ return Object.assign({blockName:'', kind:'timer', duration:null, label:'', sub:'', icon:null, unit:'none', target:'', note:'', logId:null, voiceStop:false}, o); }

function buildTractions(){
  const bracket = TRACTIONS_BRACKETS[S.tractionsBracket];
  const day = currentTractionsDay();
  const d = bracket.days[day-1];
  const all = [...d.s, d.max!=null ? `max(min ${d.max})` : d.fixed5];
  const steps = [];
  const eccNote = bracket.eccentric ? ' — excentrique : descente lente ~3s' : '';
  all.forEach((val, i)=>{
    const isMaxSet = (d.max!=null) && i===all.length-1;
    steps.push(step({
      blockName:'Tractions', kind:'manual', icon:'pullup', unit:'reps',
      label: bracket.eccentric ? 'Traction excentrique' : 'Traction', sub:`Série ${i+1}/5${eccNote}`,
      target: isMaxSet ? `Max — minimum ${d.max}` : `${val} reps`,
      logId:`tractions_s${i+1}`
    }));
    if(i < all.length-1){
      steps.push(step({blockName:'Tractions', kind:'timer', duration:120, label:'Repos', sub:`Avant série ${i+2}/5`, icon:'rest', unit:'none'}));
    }
  });
  return {name:`Tractions (${bracket.label} — Jour ${day}/${bracket.days.length})`, steps};
}

// ============ OBJECTIF DIPS AUTOMATIQUE (Pecs Lundi) ============
const DIPS_CAP = 10, DIPS_N = 5, DIPS_GILET = 'Dips + gilet 8 kg';

function dipsSessions(exName){
  const out = [];
  S.history.forEach(h=>{
    const {map} = exMapFromDetails(h.details);
    const e = map['Pecs Lundi|'+exName];
    if(e) out.push(e.values);
  });
  return out;
}

// Règle : base = meilleure valeur de chaque série sur les 2 dernières séances ;
// objectif = base +1 sur les 2 séries les plus faibles (en cas d'égalité, les dernières séries) ;
// séance en baisse de 3 reps ou plus -> on stabilise ; 5x10 atteint -> gilet 8 kg.
function computeDipsTargets(){
  const bw = dipsSessions('Dips');
  const lastBW = bw[bw.length-1];
  const reachedCap = !!lastBW && lastBW.length>=DIPS_N && lastBW.slice(0,DIPS_N).every(v=>v>=DIPS_CAP);
  const gilet = dipsSessions(DIPS_GILET);
  const useGilet = reachedCap || gilet.length>0;
  const sessions = useGilet ? gilet : bw;
  const name = useGilet ? DIPS_GILET : 'Dips';
  if(!sessions.length){
    return {name, targets: useGilet ? [6,6,5,5,5] : null, inc:[], bad:false, gilet:useGilet, fresh:true};
  }
  const pad = v => { const a = v.slice(0,DIPS_N); const m = Math.min(...a); while(a.length<DIPS_N) a.push(m); return a; };
  const last = pad(sessions[sessions.length-1]);
  const prev = sessions.length>1 ? pad(sessions[sessions.length-2]) : null;
  const base = prev ? last.map((v,k)=>Math.max(v, prev[k])) : last.slice();
  const bad = !!prev && (sumVals(last) <= sumVals(prev) - 3);
  const targets = base.slice(); const inc = [];
  if(!bad){
    base.map((v,k)=>({v,k})).filter(o=>o.v<DIPS_CAP)
      .sort((a,b)=> a.v-b.v || b.k-a.k).slice(0,2)
      .forEach(o=>{ targets[o.k]++; inc.push(o.k); });
  }
  return {name, targets, inc, bad, gilet:useGilet, fresh:false};
}

function buildPecsLundi(){
  const steps = [];
  // Échauffement : push-ups réguliers
  steps.push(step({
    blockName:'Pecs Lundi', kind:'timer', duration:PECS_WORK, icon:'pushup', unit:'reps',
    label:'Push-ups réguliers', sub:'Échauffement', target:'20', logId:'pecslundi_warmup'
  }));
  steps.push(step({blockName:'Pecs Lundi', kind:'timer', duration:90, label:'Repos', sub:'Avant Dips', icon:'rest', unit:'none'}));
  // Dips 5 séries
  const dp = computeDipsTargets();
  if(dp.targets){
    const series = dp.targets.map((t,k)=>({target: `${t} reps` + (dp.inc.includes(k) ? ' (+1)' : '') + (dp.bad ? ' (on stabilise)' : '')}));
    steps.push(...buildDipsSeriesBlock(series, 'Pecs Lundi', dp.name));
  } else {
    steps.push(...buildDipsSeriesBlock(DIPS_LUNDI, 'Pecs Lundi'));
  }
  steps.push(step({blockName:'Pecs Lundi', kind:'timer', duration:90, label:'Repos', sub:'Avant suite programme', icon:'rest', unit:'none'}));
  // Reste du programme pecs
  const suite = PECS_EXOS.slice(1); // sans push-ups réguliers déjà fait
  const total = suite.length;
  suite.forEach((ex, i)=>{
    steps.push(step({
      blockName:'Pecs Lundi', kind:'timer', duration:ex.duration || PECS_WORK, icon:ex.icon, unit:ex.unit,
      label:ex.name, sub:`Mouvement ${i+2}/${total+1}`, target:ex.target,
      logId:`pecslundi_${i}`,
      manualStart:!!ex.manualStart, earlyStopLog:!!ex.earlyStopLog, autoLogOnComplete:!!ex.autoLogOnComplete,
      midBeep:!!ex.midBeep, multiInputs:ex.multiInputs||null
    }));
    if(i < total-1){
      steps.push(step({blockName:'Pecs Lundi', kind:'timer', duration:PECS_REST, label:'Repos', sub:`Avant mouvement ${i+3}/${total+1}`, icon:'rest', unit:'none'}));
    }
  });
  return {name:'Pecs Lundi', steps};
}

        steps.push(step({blockName:'HIIT 1', kind:'timer', duration:HIIT1_REST, label:'Repos', sub:`Tour ${t}/${HIIT1_TOURS}`, icon:'rest', unit:'none'}));

      }
    });
  }
  return {name:'HIIT 1', steps};
}

/* ============ DATA HELPERS (historique + progression) ============ */
const SERIES_COLORS = ['#2fd9c4','#ff5c39','#f5c842','#6ab4e8','#c46ae8','#8d92a3'];

function parseVal(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }
function sumVals(a){ return a.reduce((x,y)=>x+y, 0); }
function metricVal(values, metric){ return metric==='best' ? Math.max(...values) : sumVals(values); }
function unitSuffix(unit){ return unit==='time' ? 's' : ''; }
function fmtNum(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function shortDate(d){ const p=(d||'').split(' '); return p.length>=4 ? p[1]+' '+p[2] : (d||''); }

function deltaHtml(diff, unit){
  if(diff===null) return `<span class="delta new">1re fois</span>`;
  const suf = unitSuffix(unit);
  if(diff>0) return `<span class="delta up">▲ +${fmtNum(diff)}${suf}</span>`;
  if(diff<0) return `<span class="delta down">▼ ${fmtNum(diff)}${suf}</span>`;
  return `<span class="delta same">= égal</span>`;
}

function groupHistoryByDate(history){
  const map = {}; const order = [];
  history.forEach(h=>{
    if(!map[h.date]){ map[h.date] = {date:h.date, blocks:[], details:[]}; order.push(h.date); }
    h.blocks.forEach(b=>{ if(!map[h.date].blocks.includes(b)) map[h.date].blocks.push(b); });
    map[h.date].details.push(...(h.details||[]));
  });
  return order.map(d=>map[d]);
}

// Fusionne "Tractions (X — Jour 2/6)" + "Tractions (X — Jour 3/6)" en un seul libellé
function mergeBlockLabels(blocks){
  const out = []; const idx = {};
  blocks.forEach(b=>{
    const m = b.match(/^(.+?) \((.+) — Jour (\d+)\/(\d+)\)$/);
    if(!m){ if(!out.some(o=>o.label===b)) out.push({label:b}); return; }
    const key = m[1]+'|'+m[2]+'|'+m[4];
    if(idx[key]===undefined){ idx[key] = out.length; out.push({prefix:m[1], mid:m[2], total:m[4], days:[m[3]]}); }
    else if(!out[idx[key]].days.includes(m[3])) out[idx[key]].days.push(m[3]);
  });
  return out.map(o=> o.label ? o.label : `${o.prefix} (${o.mid} — Jour${o.days.length>1?'s':''} ${o.days.join(' + ')}/${o.total})`);
}

// Détails -> {map, order} : une entrée par (programme|exercice) avec les valeurs numériques
function exMapFromDetails(details){
  const map = {}, order = [];
  (details||[]).forEach(d=>{
    const v = parseVal(d.value); if(v===null) return;
    const blk = d.block || 'Autres';
    const key = blk+'|'+d.exercise;
    if(!map[key]){ map[key] = {key, block:blk, exercise:d.exercise, unit:d.unit, values:[]}; order.push(key); }
    map[key].values.push(v);
  });
  return {map, order};
}
function groupRowsByBlock(order, map){
  const blocks = []; const idx = {};
  order.forEach(k=>{
    const e = map[k];
    if(idx[e.block]===undefined){ idx[e.block] = blocks.length; blocks.push({block:e.block, rows:[]}); }
    blocks[idx[e.block]].rows.push(e);
  });
  return blocks;
}

function tabsHtml(active){
  return `<div class="seg">
    <button class="seg-btn ${active==='history'?'on':''}" data-goto="history">Séances</button>
    <button class="seg-btn ${active==='progress'?'on':''}" data-goto="progress">Progression</button>
  </div>`;
}

/* ============ RENDER: HISTORY ============ */
function renderHistory(){
  const chrono = groupHistoryByDate(S.history);
  const maps = chrono.map(g=>exMapFromDetails(g.details));
  const selecting = S.historySelectMode;
  const selected = S.historySelected || [];

  const cards = chrono.map((h,i)=>{
    const {map, order} = maps[i];
    const labels = mergeBlockLabels(h.blocks);
    const usedLabels = [];
    const sections = groupRowsByBlock(order, map).map(bg=>{
      const lbl = labels.find(l=>l===bg.block || l.startsWith(bg.block+' (')) || bg.block;
      usedLabels.push(lbl);
      const rows = bg.rows.map(e=>{
        const total = sumVals(e.values);
        let prevTotal = null;
        for(let j=i-1; j>=0; j--){ const pe = maps[j].map[e.key]; if(pe){ prevTotal = sumVals(pe.values); break; } }
        const diff = prevTotal===null ? null : total - prevTotal;
        const suf = unitSuffix(e.unit);
        const multi = e.values.length>1;
        const chips = multi ? `<div class="chips">${e.values.map(v=>`<span class="chip">${fmtNum(v)}${suf}</span>`).join('')}</div>` : '';
        return `<div class="h-row">
          <div class="h-left"><div class="h-ex">${e.exercise}</div>${chips}</div>
          <div class="h-right"><div class="h-total">${fmtNum(total)}${suf}</div>${multi?'<div class="h-sub">total</div>':''}${deltaHtml(diff, e.unit)}</div>
        </div>`;
      }).join('');
      return `<div class="h-prog"><div class="h-prog-name">${lbl}</div>${rows}</div>`;
    }).join('');
    const noData = labels.filter(l=>!usedLabels.includes(l));
    const isSel = selected.includes(h.date);
    return `<div class="hist-item ${isSel?'hist-selected':''}" data-date="${h.date}">
      <div class="hist-item-top">
        <div>
          <div class="hist-date">${h.date}</div>
          ${noData.length ? `<div class="hist-blocks">${noData.join(' · ')}</div>` : ''}
        </div>
        ${selecting
          ? `<div class="hist-check ${isSel?'checked':''}" data-action="toggle"></div>`
          : `<button class="hist-del" data-action="delete-one">${svg('trash')}</button>`}
      </div>
      ${sections}
    </div>`;
  }).reverse().join('');

  const body = chrono.length===0
    ? `<div class="empty">Aucune séance enregistrée pour l'instant.<br>Lance ta première séance depuis l'accueil.</div>`
    : cards;

  return `
    <div class="topbar">
      <div class="icon-btn" id="btn-back-home">${svg('history')}</div>
      <div class="brand-title">Historique</div>
      ${chrono.length>0 ? `<button class="icon-btn" id="btn-toggle-select" style="width:auto; padding:0 12px; font-size:12px; font-weight:700;">${selecting?'Annuler':'Sélectionner'}</button>` : `<div style="width:38px"></div>`}
    </div>
    <main>${tabsHtml('history')}${body}</main>
    ${selecting && selected.length>0 ? `
      <div class="cta-bar">
        <button class="btn btn-primary" id="btn-delete-selected" style="background:var(--accent);">Supprimer (${selected.length})</button>
      </div>` : ''}
  `;
}

/* ============ RENDER: PROGRESSION ============ */
function progressBlocks(){
  const seen = [];
  for(let i=S.history.length-1; i>=0; i--){
    (S.history[i].details||[]).forEach(d=>{
      const blk = d.block || 'Autres';
      if(parseVal(d.value)!==null && !seen.includes(blk)) seen.push(blk);
    });
  }
  return seen;
}

// Pour un programme : liste d'exercices avec leurs séances [{label, date, values}]
function progressExercises(block){
  const map = {}, order = [];
  S.history.forEach(h=>{
    const {map:m, order:o} = exMapFromDetails(h.details);
    o.forEach(k=>{
      const e = m[k];
      if(e.block!==block) return;
      if(!map[e.exercise]){ map[e.exercise] = {name:e.exercise, unit:e.unit, sessions:[]}; order.push(e.exercise); }
      map[e.exercise].sessions.push({label:shortDate(h.date), date:h.date, values:e.values});
    });
  });
  return order.map(n=>map[n]);
}

function chartSvg(sessions, metric, big){
  const n = sessions.length;
  const W = big ? 320 : 300, H = big ? 150 : 56;
  const pl = big ? 30 : 8, pr = big ? 12 : 8, pt = big ? 16 : 8, pb = big ? 22 : 8;
  let lines = [];
  if(metric==='series'){
    const maxN = Math.max(...sessions.map(s=>s.values.length));
    for(let k=0; k<maxN; k++){
      const pts = [];
      sessions.forEach((s,i)=>{ if(s.values[k]!==undefined) pts.push({i, v:s.values[k]}); });
      lines.push({pts, color:SERIES_COLORS[k%SERIES_COLORS.length]});
    }
  } else {
    lines = [{pts: sessions.map((s,i)=>({i, v:metricVal(s.values, metric)})), color:'#2fd9c4', main:true}];
  }
  const all = lines.flatMap(l=>l.pts.map(p=>p.v));
  let min = Math.min(...all), max = Math.max(...all);
  if(min===max){ min = Math.max(0, min-1); max = max+1; }
  else if(big){ const pad = (max-min)*0.12; min = Math.max(0, min-pad); max = max+pad; }
  const X = i => pl + (n===1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(n-1));
  const Y = v => pt + (max-v)*(H-pt-pb)/(max-min);

  let out = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">`;
  if(big){
    [min, (min+max)/2, max].forEach(t=>{
      const y = Y(t).toFixed(1);
      out += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#30354f" stroke-width="0.6" stroke-dasharray="2 3"/>`;
      out += `<text x="${pl-5}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#8d92a3">${Math.round(t)}</text>`;
    });
    const idxs = n<=3 ? [...Array(n).keys()] : [0, Math.floor((n-1)/2), n-1];
    idxs.forEach(i=>{
      const anchor = n===1 ? 'middle' : (i===0 ? 'start' : (i===n-1 ? 'end' : 'middle'));
      out += `<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${anchor}" font-size="9" fill="#8d92a3">${sessions[i].label}</text>`;
    });
  }
  lines.forEach(l=>{
    if(l.pts.length>1){
      const d = l.pts.map((p,idx)=>`${idx?'L':'M'}${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
      out += `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${big?2:1.8}" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    l.pts.forEach(p=>{
      out += `<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${big?3:2.4}" fill="${l.color}"/>`;
      if(big && l.main && n<=10){
        out += `<text x="${X(p.i).toFixed(1)}" y="${(Y(p.v)-7).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#f4f2ec">${fmtNum(p.v)}</text>`;
      }
    });
    if(!big && l.main){
      const lp = l.pts[l.pts.length-1];
      out += `<circle cx="${X(lp.i).toFixed(1)}" cy="${Y(lp.v).toFixed(1)}" r="5" fill="none" stroke="${l.color}" stroke-opacity="0.4" stroke-width="1.5"/>`;
    }
  });
  out += `</svg>`;
  return out;
}

function progressDetailHtml(ex, metric){
  const suf = unitSuffix(ex.unit);
  const maxN = Math.max(...ex.sessions.map(s=>s.values.length));
  const legend = (metric==='series' && maxN>1)
    ? `<div class="legend">${Array.from({length:maxN}, (_,k)=>`<span><i style="background:${SERIES_COLORS[k%SERIES_COLORS.length]}"></i>Série ${k+1}</span>`).join('')}</div>`
    : '';
  const rows = ex.sessions.slice().reverse().map(s=>`
    <div class="d-row">
      <div class="d-date">${s.label}</div>
      <div class="chips">${s.values.map(v=>`<span class="chip">${fmtNum(v)}${suf}</span>`).join('')}</div>
      <div class="d-total">${fmtNum(sumVals(s.values))}${suf}</div>
    </div>`).join('');
  return `<div class="p-detail">
    ${chartSvg(ex.sessions, metric, true)}
    ${legend}
    <div class="d-head"><span>Date</span><span>Séries</span><span style="text-align:right">Total</span></div>
    ${rows}
  </div>`;
}

function progressCardHtml(ex, i, metric){
  const m = metric==='series' ? 'total' : metric;
  const vals = ex.sessions.map(s=>metricVal(s.values, m));
  const last = vals[vals.length-1];
  const prev = vals.length>1 ? vals[vals.length-2] : null;
  const rec = Math.max(...vals);
  const suf = unitSuffix(ex.unit);
  const open = S.progOpen === ex.name;
  const single = ex.sessions.every(s=>s.values.length===1);
  const lbl = single ? (ex.unit==='time' ? 'durée' : 'reps') : (m==='best' ? 'meilleure série' : 'total');
  let goal = '';
  if(S.progBlock==='Pecs Lundi' && (ex.name==='Dips' || ex.name===DIPS_GILET)){
    const dp = computeDipsTargets();
    if(dp.targets && dp.name===ex.name) goal = `<div class="p-goal">🎯 Prochain objectif : ${dp.targets.join(' · ')} <span>(total ${sumVals(dp.targets)})</span></div>`;
  }
  return `<div class="p-card ${open?'open':''}">
    <div class="p-head" data-prog-ex="${i}">
      <div class="p-top">
        <div class="p-name">${ex.name}</div>
        <div class="p-last"><span class="p-last-val">${fmtNum(last)}${suf}</span><span class="p-last-lbl">${lbl}</span></div>
      </div>
      <div class="p-mid">
        <div class="p-spark">${chartSvg(ex.sessions, m, false)}</div>
        <div class="p-delta">${deltaHtml(prev===null ? null : last-prev, ex.unit)}</div>
      </div>
      ${goal}
      <div class="p-foot">
        <span>${ex.sessions.length} séance${ex.sessions.length>1?'s':''}</span>
        <span>🏆 Record ${fmtNum(rec)}${suf}</span>
        <span>${open?'▲':'▼'}</span>
      </div>
    </div>
    ${open ? progressDetailHtml(ex, metric) : ''}
  </div>`;
}

function renderProgress(){
  const blocks = progressBlocks();
  const head = `
    <div class="topbar">
      <div class="icon-btn" id="btn-back-home">${svg('history')}</div>
      <div class="brand-title">Progression</div>
      <div style="width:38px"></div>
    </div>`;
  if(!blocks.length){
    return head + `<main>${tabsHtml('progress')}<div class="empty">Pas encore de données.<br>Termine une séance avec saisie de reps ou de temps pour voir tes courbes.</div></main>`;
  }
  if(!S.progBlock || !blocks.includes(S.progBlock)) S.progBlock = blocks[0];
  const metric = S.progMetric || 'total';
  const exs = progressExercises(S.progBlock);
  const chips = blocks.map(b=>`<button class="prog-chip ${b===S.progBlock?'on':''}" data-prog-block="${b}">${b}</button>`).join('');
  const metrics = [['total','Total'],['best','Meilleure série'],['series','Par série']]
    .map(([k,l])=>`<button class="seg-btn ${metric===k?'on':''}" data-metric="${k}">${l}</button>`).join('');
  return head + `<main>
    ${tabsHtml('progress')}
    <div class="prog-chips">${chips}</div>
    <div class="seg">${metrics}</div>
    ${metric==='series' ? `<div class="prog-hint">Ouvre un exercice pour voir une courbe par série.</div>` : ''}
    ${exs.map((ex,i)=>progressCardHtml(ex, i, metric)).join('')}
  </main>`;
}

/* ============ PLAYER ============ */
function primeAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
  try{
    if('speechSynthesis' in window){
      loadVoices();
      if(!cachedVoices.length){
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 1;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function startSession(){
  primeAudio();
  const defs = blockDefs();
  let steps = [];
  let names = [];
  S.selected.forEach(key=>{
    const def = defs.find(d=>d.key===key);
    const built = def.build();
    steps = steps.concat(built.steps);
    names.push(built.name);
    if(built.onComplete) steps[steps.length-1]._onCompleteAfter = built.onComplete; // tagged on last step of that block - handled separately
  });
  S.queue = steps;
  S.blockNames = names;
  S.idx = 0;
  S.sessionLog = [];
  S.phase = 'idle';
  S.screen = 'player';
  render();
  beginQueue();
}

function startPrecountdown(onDone){
  S.phase = 'precountdown';
  S.remaining = 7;
  render();
  clearTimerHandle();
  S.timerHandle = setInterval(()=>{
    S.remaining--;
    if(S.remaining > 0){
      beep(false);
      render();
    } else {
      beep(true);
      clearTimerHandle();
      onDone();
    }
  }, 1000);
}

function beginQueue(){
  const first = S.queue[0];
  if(first && first.kind === 'timer' && !first.manualStart){
    startPrecountdown(()=>goToStep(0));
  } else {
    goToStep(0);
  }
}

function currentStep(){ return S.queue[S.idx]; }

let cachedVoices = [];
function loadVoices(){
  try{
    cachedVoices = window.speechSynthesis.getVoices() || [];
  }catch(e){}
}
function pickVoice(){
  if(!cachedVoices.length) loadVoices();
  let v = cachedVoices.find(v=>v.lang && v.lang.toLowerCase().startsWith('fr'));
  return v || cachedVoices[0] || null;
}

let lastSpeechStatus = 'jamais testé';
let speechRetried = false;
function speak(text){
  try{
    if(!('speechSynthesis' in window)){ lastSpeechStatus = 'API absente'; return; }
    window.speechSynthesis.cancel();
    speechRetried = false;
    setTimeout(()=>{ trySpeak(text); }, 80);
  }catch(e){}
}
function trySpeak(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if(!speechRetried){
      if(v) u.voice = v;
      u.lang = (v && v.lang) ? v.lang : 'fr-FR';
    }
    // sur le 2e essai (après échec), on ne force ni voix ni langue : voix par défaut du système
    u.rate = 1;
    u.volume = 1;
    lastSpeechStatus = speechRetried ? 'nouvel essai (voix système par défaut)' : `appelé (voix: ${v ? v.name+' / '+v.lang : 'aucune'})`;
    u.onstart = ()=>{ lastSpeechStatus = (speechRetried?'[2e essai] ':'')+'lecture démarrée (onstart)'; render(); };
    u.onerror = (e)=>{
      lastSpeechStatus = (speechRetried?'[2e essai] ':'')+'ERREUR: '+(e.error||'inconnue');
      if(!speechRetried){
        speechRetried = true;
        render();
        setTimeout(()=>trySpeak(text), 120);
        return;
      }
      render();
    };
    u.onend = ()=>{ lastSpeechStatus += ' → terminé'; render(); };
    window.speechSynthesis.speak(u);
    render();
  }catch(e){ lastSpeechStatus = 'exception JS: '+e.message; render(); }
}

function goToStep(i){
  clearTimerHandle();
  if(i >= S.queue.length){ finishSession(); return; }
  S.idx = i;
  const st = currentStep();
  if(!isRestStep(st) && S.announcedStepIdx !== i) speak('Prochain exercice : ' + st.label);
  S.announcedStepIdx = -1;
  if(st.kind === 'timer'){
    S.remaining = st.duration;
    if(st.manualStart){
      S.phase = 'ready';
      render();
    } else {
      S.phase = 'running';
      render();
      runTimerTick();
      if(st.voiceStop) startVoiceStop();
    }
  } else {
    S.phase = 'manual';
    render();
  }
}

let voiceRecog = null;

function startVoiceStop(){
  try{
    if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    voiceRecog = new SR();
    voiceRecog.lang = 'fr-FR';
    voiceRecog.continuous = true;
    voiceRecog.interimResults = false;
    voiceRecog.onresult = (e)=>{
      for(let i=e.resultIndex; i<e.results.length; i++){
        const word = e.results[i][0].transcript.trim().toLowerCase();
        if(word.includes('stop') || word.includes('lâché') || word.includes('lache') || word.includes('arrêt') || word.includes('arrete')){
          stopEarly();
          stopVoiceStop();
          return;
        }
      }
    };
    voiceRecog.onend = ()=>{
      // Relance automatiquement si l'exercice est encore en cours
      const st = currentStep();
      if(st && st.voiceStop && S.phase === 'running'){
        try{ voiceRecog.start(); }catch(e){ voiceRecog = null; }
      } else {
        voiceRecog = null;
      }
    };
    voiceRecog.onerror = (e)=>{
      if(e.error === 'no-speech' || e.error === 'aborted') return; // relance via onend
      voiceRecog = null;
    };
    voiceRecog.start();
  }catch(e){}
}

function stopVoiceStop(){
  try{ if(voiceRecog){ voiceRecog.stop(); voiceRecog = null; } }catch(e){}
}

function startManualTimer(){
  const st = currentStep();
  startPrecountdown(()=>{
    S.remaining = st.duration;
    S.phase = 'running';
    render();
    runTimerTick();
    if(st.voiceStop) startVoiceStop();
  });
}

function clearTimerHandle(){ if(S.timerHandle){ clearInterval(S.timerHandle); S.timerHandle=null; } }

function isRestStep(st){ return st && (st.label === 'Repos' || st.label === 'Repos entre rounds'); }

let audioCtx = null;
function beep(strong){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = strong ? 1046 : 784;
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.95, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+(strong?0.32:0.16));
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now+(strong?0.34:0.18));
    if(strong){
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'square';
      osc2.frequency.value = 1046;
      gain2.gain.setValueAtTime(0.0001, now+0.18);
      gain2.gain.exponentialRampToValueAtTime(0.95, now+0.19);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now+0.4);
      osc2.connect(gain2); gain2.connect(audioCtx.destination);
      osc2.start(now+0.18); osc2.stop(now+0.42);
    }
  }catch(e){}
}

function runTimerTick(){
  clearTimerHandle();
  S.timerHandle = setInterval(()=>{
    S.remaining--;
    const st = currentStep();
    if(isRestStep(st) && S.remaining === 8){
      const next = S.queue[S.idx+1];
      if(next && !isRestStep(next) && S.announcedStepIdx !== S.idx+1){
        speak('Prochain exercice : ' + next.label);
        S.announcedStepIdx = S.idx+1;
      }
    }
    if(st && st.midBeep && st.duration && S.remaining === Math.round(st.duration/2)){ beep(true); }
    if(S.remaining > 0 && S.remaining <= 7){ beep(false); }
    if(S.remaining <= 0){
      beep(true);
      clearTimerHandle();
      onTimerEnd();
    } else {
      updateRingDisplay();
    }
  }, 1000);
}

function onTimerEnd(){
  const st = currentStep();
  const isRest = isRestStep(st);
  if(isRest){
    advanceStep();
  } else if(st.autoLogOnComplete){
    stopVoiceStop();
    if(st.logId) S.sessionLog.push({block:st.blockName, exercise:st.label, sub:st.sub, value:st.duration, unit:st.unit});
    advanceStep();
  } else if(st.unit !== 'none'){
    S.phase = 'confirm';
    render();
  } else {
    advanceStep();
  }
}

function stopEarly(){
  stopVoiceStop();
  const st = currentStep();
  clearTimerHandle();
  const held = Math.max(0, st.duration - S.remaining);
  if(st.logId) S.sessionLog.push({block:st.blockName, exercise:st.label, sub:st.sub, value:held, unit:st.unit});
  advanceStep();
}

function advanceStep(){
  goToStep(S.idx+1);
}

function logValue(value){
  const st = currentStep();
  if(st.logId){
    S.sessionLog.push({block:st.blockName, exercise:st.label, sub:st.sub, value, unit:st.unit});
  }
  advanceStep();
}

function logMultiValues(entries){
  const st = currentStep();
  entries.forEach(e=>{
    if(e.value==='' || e.value==null) return;
    S.sessionLog.push({block:st.blockName, exercise:`${st.label} — ${e.label}`, sub:st.sub, value:e.value, unit:st.unit});
  });
  advanceStep();
}

function skipStep(){
  const st = currentStep();
  if(st.kind==='timer' && st.unit!=='none' && (st.label!=='Repos') && !st.autoLogOnComplete){
    S.phase='confirm'; clearTimerHandle(); render(); return;
  }
  advanceStep();
}

function pauseResume(){
  if(S.phase==='running'){ clearTimerHandle(); S.phase='paused'; render(); }
  else if(S.phase==='paused'){ S.phase='running'; render(); runTimerTick(); }
}

async function finishSession(){
  clearTimerHandle();
  // run any onComplete callbacks (e.g. tractions day increment) once
  blockDefs().forEach(d=>{ if(S.selected.includes(d.key) && d.key==='tractions'){ /* handled below */ } });
  if(S.selected.includes('tractions')){
    await advanceTractionsDay();
  }
  if(S.selected.includes('muscleup')){
    await advanceMuscleupDay();
  }
  const entry = {
    date: new Date().toLocaleDateString('fr-FR', {weekday:'short', day:'2-digit', month:'short', year:'numeric'}),
    blocks: S.blockNames,
    details: S.sessionLog.map(l=>({block:l.block, exercise:l.exercise, sub:l.sub, value:l.value, unit:l.unit}))
  };
  S.history.push(entry);
  await saveHistory();
  S.phase = 'done';
  render();
}

function getLastValue(block, exercise, sub){
  for(let i=S.history.length-1; i>=0; i--){
    const h = S.history[i];
    const match = (h.details||[]).find(d=>d.block===block && d.exercise===exercise && d.sub===sub && d.value!=='' && d.value!=null);
    if(match) return match;
  }
  return null;
}

function getMaxValue(block, exercise){
  let max = null;
  S.history.forEach(h=>{
    (h.details||[]).forEach(d=>{
      if(d.block===block && d.exercise===exercise && d.value!=='' && d.value!=null){
        const v = parseFloat(d.value);
        if(!isNaN(v) && (max===null || v > max)) max = {value:v, unit:d.unit};
      }
    });
  });
  return max;
}

function formatVal(v, unit){ return v + (unit==='time' ? 's' : ' reps'); }

function statsRow(st){
  const last = getLastValue(st.blockName, st.label, st.sub);
  const rec = getMaxValue(st.blockName, st.label);
  if(!last && !rec) return '';
  const lastHtml = last ? `<div class="last-time">⏱ Dernière : <b>${formatVal(last.value, last.unit)}</b></div>` : '';
  const recVal = rec ? parseFloat(rec.value) : null;
  const lastVal = last ? parseFloat(last.value) : null;
  // Affiche le record seulement s'il est strictement supérieur à la dernière fois
  const showRec = rec && (lastVal === null || recVal > lastVal);
  const recHtml = showRec ? `<div class="record-time">🏆 Record : <b>${formatVal(rec.value, rec.unit)}</b></div>` : '';
  return `<div class="stats-row">${lastHtml}${recHtml}</div>`;
}

function ringDash(){ const R=105; return 2*Math.PI*R; }

function updateRingDisplay(){
  const timeEl = document.getElementById('ring-time-val');
  const ringFg = document.getElementById('ring-fg');
  const st = currentStep();
  if(timeEl) timeEl.textContent = S.remaining;
  if(ringFg){
    const total = st.duration || 1;
    const pct = S.remaining/total;
    const C = ringDash();
    ringFg.style.strokeDashoffset = (C*(1-pct)).toFixed(1);
  }
}

function renderPlayer(){
  if(S.phase === 'precountdown'){
    const upcoming = currentStep() || S.queue[0];
    return `
      <div class="topbar"><div class="icon-btn" id="btn-quit">${svg('history')}</div><div class="brand-title">${upcoming ? upcoming.blockName : ''}</div><div style="width:38px"></div></div>
      <main>
        <div class="player-wrap">
          <div class="player-tag">PRÉPARE-TOI</div>
          <div class="player-name">${upcoming ? upcoming.label : ''}</div>
          <div class="ring-wrap">
            <svg viewBox="0 0 230 230">
              <circle class="ring-bg" cx="115" cy="115" r="105"></circle>
            </svg>
            <div class="ring-center">
              <div class="ring-time">${S.remaining}</div>
            </div>
          </div>
        </div>
      </main>
    `;
  }
  const st = currentStep();
  if(!st){ return renderDone(); }
  const total = S.queue.length;
  const dots = S.queue.map((s,i)=>`<span class="${i<S.idx?'done':i===S.idx?'current':''}"></span>`).join('');
  const isRest = st.label==='Repos' || st.label==='Repos entre rounds';

  if(S.phase === 'manual'){
    const last = getLastValue(st.blockName, st.label, st.sub);
    return `
      <div class="topbar"><div class="icon-btn" id="btn-quit">${svg('history')}</div><div class="brand-title">${st.blockName}</div><div style="width:38px"></div></div>
      <main>
        <div class="player-wrap">
          <div class="player-tag">${st.sub}</div>
          <div class="manual-card">
            <div class="manual-icon">${svg(st.icon || 'pullup')}</div>
            <div class="player-name">${st.label}</div>
            <div class="player-target">Objectif : ${st.target}</div>
            ${statsRow(st)}
            ${st.unit!=='none' ? `
              <div class="input-row">
                <input type="number" id="manual-input" inputmode="numeric" placeholder="${last?last.value:'0'}">
                <span class="unit">${st.unit==='time'?'sec':'reps'}</span>
              </div>` : ''}
            <button class="btn btn-primary" id="btn-validate" style="width:100%; margin-top:10px;">Valider et continuer</button>
          </div>
          <div class="progress-dots">${dots}</div>
          <div class="skip-row"><button id="btn-skip">passer cet exercice</button></div>
        </div>
      </main>
    `;
  }

  if(S.phase === 'confirm'){
    if(st.multiInputs){
      const rows = st.multiInputs.map((mi,idx)=>{
        const last = getLastValue(st.blockName, `${st.label} — ${mi.label}`, st.sub);
        return `<div class="multi-input-row">
          <span class="multi-input-label">${mi.label}${last?` <i>(dernière fois: ${last.value})</i>`:''}</span>
          <input type="number" class="multi-input" data-key="${mi.key}" data-label="${mi.label}" inputmode="numeric" placeholder="${last?last.value:'0'}">
        </div>`;
      }).join('');
      return `
        <div class="topbar"><div class="icon-btn" id="btn-quit">${svg('history')}</div><div class="brand-title">${st.blockName}</div><div style="width:38px"></div></div>
        <main>
          <div class="player-wrap">
            <div class="player-tag">${st.sub}</div>
            <div class="manual-card">
              <div class="manual-icon">${svg(st.icon || 'pushup')}</div>
              <div class="player-name">${st.label}</div>
              <div class="player-target">Objectif : ${st.target}</div>
              <div class="multi-input-list">${rows}</div>
              <button class="btn btn-primary" id="btn-validate-multi" style="width:100%; margin-top:10px;">Continuer</button>
            </div>
            <div class="progress-dots">${dots}</div>
          </div>
        </main>
      `;
    }
    const last = getLastValue(st.blockName, st.label, st.sub);
    return `
      <div class="topbar"><div class="icon-btn" id="btn-quit">${svg('history')}</div><div class="brand-title">${st.blockName}</div><div style="width:38px"></div></div>
      <main>
        <div class="player-wrap">
          <div class="player-tag">${st.sub}</div>
          <div class="manual-card">
            <div class="manual-icon">${svg(st.icon || 'pushup')}</div>
            <div class="player-name">${st.label}</div>
            <div class="player-target">Objectif : ${st.target}</div>
            ${statsRow(st)}
            <div class="input-row">
              <input type="number" id="manual-input" inputmode="numeric" placeholder="${last?last.value:'0'}">
              <span class="unit">${st.unit==='time'?'sec':'reps'}</span>
            </div>
            <button class="btn btn-primary" id="btn-validate" style="width:100%; margin-top:10px;">Continuer</button>
          </div>
          <div class="progress-dots">${dots}</div>
        </div>
      </main>
    `;
  }

  if(S.phase === 'ready'){
    return `
      <div class="topbar"><div class="icon-btn" id="btn-quit">${svg('history')}</div><div class="brand-title">${st.blockName}</div><div style="width:38px"></div></div>
      <main>
        <div class="player-wrap">
          <div class="player-tag">${st.sub}</div>
          <div class="manual-card">
            <div class="manual-icon">${svg(st.icon || 'lsit')}</div>
            <div class="player-name">${st.label}</div>
            <div class="player-target">Objectif : ${st.target}</div>
            ${statsRow(st)}
            <button class="btn btn-primary" id="btn-lancer" style="width:100%; margin-top:14px;">Lancer</button>
          </div>
          <div class="progress-dots">${dots}</div>
        </div>
      </main>
    `;
  }

  // running / paused timer
  const C = ringDash();
  const nextStep = isRest ? S.queue[S.idx+1] : null;
  return `
    <div class="topbar"><div class="icon-btn" id="btn-quit">${svg('history')}</div><div class="brand-title">${st.blockName}</div><div style="width:38px"></div></div>
    <main>
      <div class="player-wrap">
        <div class="player-tag">${isRest?'REPOS':'EN COURS'}</div>
        <div class="player-name">${st.label}</div>
        <div class="player-sub">${st.sub}</div>
        <div class="ring-wrap">
          <svg viewBox="0 0 230 230">
            <circle class="ring-bg" cx="115" cy="115" r="105"></circle>
            <circle id="ring-fg" class="ring-fg ${isRest?'rest':''}" cx="115" cy="115" r="105"
              stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-S.remaining/st.duration)).toFixed(1)}"></circle>
          </svg>
          <div class="ring-center">
            <div class="ring-icon">${svg(st.icon || 'rest')}</div>
            <div class="ring-time ${isRest?'rest':''}" id="ring-time-val">${S.remaining}</div>
          </div>
        </div>
        ${nextStep ? `<div class="next-up">
          <div class="next-up-label">Prochain exercice</div>
          <div class="next-up-icon">${svg(nextStep.icon || 'rest')}</div>
          <div class="next-up-name">${nextStep.label}</div>
        </div>` : ''}
        <div class="player-controls">
          <button class="btn btn-ghost" id="btn-pause">${S.phase==='paused'?'Reprendre':'Pause'}</button>
          ${st.earlyStopLog && !isRest ? `<button class="btn btn-secondary" id="btn-stop-early">J'ai lâché</button>` : `<button class="btn btn-secondary" id="btn-skip">Passer</button>`}
        </div>
        <div class="progress-dots">${dots}</div>
      </div>
    </main>
  `;
}

function renderDone(){
  const lines = S.sessionLog.map(l=>`<div class="summary-row"><span class="summary-ex">${l.exercise}</span><span class="summary-val">${l.value || '—'}${l.unit==='time'?'s':l.unit==='reps'?' reps':''}</span></div>`).join('');
  return `
    <div class="topbar"><div style="width:38px"></div><div class="brand-title">Séance terminée</div><div style="width:38px"></div></div>
    <main>
      <div class="player-wrap" style="padding-top:20px;">
        <div class="manual-icon">${svg('bolt')}</div>
        <h1 class="page-title">Bien joué 💪</h1>
        <p class="page-sub" style="text-align:center;">${S.blockNames.join(' · ')}</p>
        ${lines ? `<div class="manual-card" style="width:100%;">${lines}</div>` : ''}
      </div>
    </main>
    <div class="cta-bar">
      <button class="btn btn-primary" id="btn-home">Retour à l'accueil</button>
    </div>
  `;
}

/* ============ MASTER RENDER ============ */
function render(){
  const app = document.getElementById('app');
  if(S.screen==='home') app.innerHTML = renderHome();
  else if(S.screen==='history') app.innerHTML = renderHistory();
  else if(S.screen==='progress') app.innerHTML = renderProgress();
  else if(S.screen==='player'){
    app.innerHTML = (S.phase==='done') ? renderDone() : renderPlayer();
  }
  bindEvents();
}

function bindEvents(){
  const byId = id => document.getElementById(id);
  document.querySelectorAll('.block-card').forEach(card=>{
    card.onclick = (e)=>{
      if(e.target && (e.target.id === 'bracket-select' || e.target.id === 'day-select' || e.target.id === 'lsit-duration-input' || e.target.id === 'muscleup-bracket-select' || e.target.id === 'muscleup-day-select' || e.target.id === 'tabata-blocs-select')) return;
      const key = card.dataset.key;
      const pos = S.selected.indexOf(key);
      if(pos>=0) S.selected.splice(pos,1);
      else S.selected.push(key);
      render();
    };
  });
  if(byId('bracket-select')) byId('bracket-select').onchange = async (e)=>{
    await setTractionsBracket(e.target.value);
    render();
  };
  if(byId('day-select')) byId('day-select').onchange = async (e)=>{
    await setTractionsDay(parseInt(e.target.value,10));
    render();
  };
  if(byId('lsit-duration-input')) byId('lsit-duration-input').onchange = async (e)=>{
    await setLsitDuration(parseInt(e.target.value,10) || LSIT_DEFAULT_DURATION);
    render();
  };
  if(byId('muscleup-bracket-select')) byId('muscleup-bracket-select').onchange = async (e)=>{
    await setMuscleupBracket(e.target.value);
    render();
  };
  if(byId('muscleup-day-select')) byId('muscleup-day-select').onchange = async (e)=>{
    await setMuscleupDay(parseInt(e.target.value,10));
    render();
  };
  if(byId('tabata-blocs-select')) byId('tabata-blocs-select').onchange = (e)=>{
    S.tabataBlocs = parseInt(e.target.value,10);
    render();
  };
  if(byId('btn-clear')) byId('btn-clear').onclick = ()=>{ S.selected=[]; render(); };
  document.querySelectorAll('.cat-header').forEach(h=>{
    h.onclick = ()=>{
      const id = h.dataset.catid;
      const idx = S.expandedCats.indexOf(id);
      if(idx>=0) S.expandedCats.splice(idx,1); else S.expandedCats.push(id);
      render();
    };
  });
  if(byId('btn-test-voice')) byId('btn-test-voice').onclick = (e)=>{
    e.target.textContent = 'Test envoyé ✓ (écoute…)';
    primeAudio();
    setTimeout(()=>speak('Squat'), 150);
    setTimeout(()=>{ if(byId('btn-test-voice')) byId('btn-test-voice').textContent = 'Tester la voix'; }, 2500);
  };
  if(byId('btn-start')) byId('btn-start').onclick = ()=>{ if(S.selected.length) startSession(); };
  if(byId('btn-history')) byId('btn-history').onclick = ()=>{ S.screen='history'; render(); };
  if(byId('btn-back-home')) byId('btn-back-home').onclick = ()=>{ S.historySelectMode=false; S.historySelected=[]; S.screen='home'; render(); };
  document.querySelectorAll('[data-goto]').forEach(b=>{
    b.onclick = ()=>{ S.screen = b.dataset.goto; S.historySelectMode=false; S.historySelected=[]; render(); window.scrollTo(0,0); };
  });
  document.querySelectorAll('[data-prog-block]').forEach(b=>{
    b.onclick = ()=>{ S.progBlock = b.dataset.progBlock; S.progOpen = null; render(); };
  });
  document.querySelectorAll('[data-metric]').forEach(b=>{
    b.onclick = ()=>{ S.progMetric = b.dataset.metric; render(); };
  });
  document.querySelectorAll('[data-prog-ex]').forEach(h=>{
    h.onclick = ()=>{
      const ex = progressExercises(S.progBlock)[parseInt(h.dataset.progEx,10)];
      if(!ex) return;
      S.progOpen = (S.progOpen===ex.name) ? null : ex.name;
      render();
    };
  });
  const onChip = document.querySelector('.prog-chip.on');
  if(onChip && onChip.parentElement) onChip.parentElement.scrollLeft = Math.max(0, onChip.offsetLeft - 16);
  if(byId('btn-toggle-select')) byId('btn-toggle-select').onclick = ()=>{
    S.historySelectMode = !S.historySelectMode;
    S.historySelected = [];
    render();
  };
  if(byId('btn-delete-selected')) byId('btn-delete-selected').onclick = async ()=>{
    if(confirm(`Supprimer ${S.historySelected.length} jour(s) de l'historique ? Cette action est définitive.`)){
      await deleteHistoryDates(S.historySelected);
      S.historySelectMode = false;
      S.historySelected = [];
      render();
    }
  };
  document.querySelectorAll('.hist-item').forEach(card=>{
    const date = card.dataset.date;
    card.onclick = (e)=>{
      const action = e.target.closest('[data-action]');
      if(!action) return;
      if(action.dataset.action === 'toggle'){
        const i = S.historySelected.indexOf(date);
        if(i>=0) S.historySelected.splice(i,1); else S.historySelected.push(date);
        render();
      } else if(action.dataset.action === 'delete-one'){
        if(confirm(`Supprimer la séance du ${date} ?`)){
          deleteHistoryDates([date]).then(render);
        }
      }
    };
  });
  if(byId('btn-quit')) byId('btn-quit').onclick = ()=>{ clearTimerHandle(); S.screen='home'; render(); };
  if(byId('btn-home')) byId('btn-home').onclick = ()=>{ S.screen='home'; render(); };
  if(byId('btn-pause')) byId('btn-pause').onclick = pauseResume;
  if(byId('btn-skip')) byId('btn-skip').onclick = skipStep;
  if(byId('btn-lancer')) byId('btn-lancer').onclick = startManualTimer;
  if(byId('btn-stop-early')) byId('btn-stop-early').onclick = stopEarly;
  if(byId('btn-validate')) byId('btn-validate').onclick = ()=>{
    const inp = byId('manual-input');
    const val = inp ? inp.value : '';
    logValue(val);
  };
  if(byId('btn-validate-multi')) byId('btn-validate-multi').onclick = ()=>{
    const entries = Array.from(document.querySelectorAll('.multi-input')).map(inp=>({
      key: inp.dataset.key, label: inp.dataset.label, value: inp.value
    }));
    logMultiValues(entries);
  };
}

/* ============ INIT ============ */
(async function init(){
  await loadState();
  try{
    if('speechSynthesis' in window){
      loadVoices();
      window.speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); render(); };
    }
  }catch(e){}
  render();
})();
</script>
</body>
</html>
